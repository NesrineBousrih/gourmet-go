name: Gourmet-Go CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_USERNAME: nesrinebousrih

jobs:
  # ─── Job 1: Build & Test ──────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies - Order Service
        run: |
          pip install -r order-service/requirements.txt

      - name: Install dependencies - Kitchen Service
        run: |
          pip install -r kitchen-service/requirements.txt

      - name: Install dependencies - Accounting Service
        run: |
          pip install -r accounting-service/requirements.txt

      - name: Install dependencies - Orchestrator
        run: |
          pip install -r orchestrator/requirements.txt

      - name: Install dependencies - API Gateway
        run: |
          pip install -r api-gateway/requirements.txt

      - name: Generate gRPC stubs
        run: |
          pip install grpcio-tools==1.62.1
          python -m grpc_tools.protoc -I./protos --python_out=./order-service --grpc_python_out=./order-service ./protos/order.proto
          python -m grpc_tools.protoc -I./protos --python_out=./kitchen-service --grpc_python_out=./kitchen-service ./protos/kitchen.proto
          python -m grpc_tools.protoc -I./protos --python_out=./accounting-service --grpc_python_out=./accounting-service ./protos/accounting.proto
          python -m grpc_tools.protoc -I./protos --python_out=./orchestrator --grpc_python_out=./orchestrator ./protos/order.proto
          python -m grpc_tools.protoc -I./protos --python_out=./orchestrator --grpc_python_out=./orchestrator ./protos/kitchen.proto
          python -m grpc_tools.protoc -I./protos --python_out=./orchestrator --grpc_python_out=./orchestrator ./protos/accounting.proto
          python -m grpc_tools.protoc -I./protos --python_out=./api-gateway --grpc_python_out=./api-gateway ./protos/order.proto
          python -m grpc_tools.protoc -I./protos --python_out=./api-gateway --grpc_python_out=./api-gateway ./protos/kitchen.proto
          python -m grpc_tools.protoc -I./protos --python_out=./api-gateway --grpc_python_out=./api-gateway ./protos/accounting.proto

      - name: Verify stubs generated
        run: |
          echo "--- Generated Python files ---"
          find . -name "*_pb2*.py" | sort

      - name: Syntax check - Order Service
        run: python -m py_compile order-service/main.py

      - name: Syntax check - Kitchen Service
        run: python -m py_compile kitchen-service/main.py

      - name: Syntax check - Accounting Service
        run: python -m py_compile accounting-service/main.py

      - name: Syntax check - Orchestrator
        run: python -m py_compile orchestrator/main.py

      - name: Syntax check - API Gateway
        run: python -m py_compile api-gateway/main.py

  # ─── Job 2: Build & Push Docker Images ───────────────────
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate gRPC stubs before Docker build
        run: |
          pip install grpcio-tools==1.62.1
          python -m grpc_tools.protoc -I./protos --python_out=./order-service --grpc_python_out=./order-service ./protos/order.proto
          python -m grpc_tools.protoc -I./protos --python_out=./kitchen-service --grpc_python_out=./kitchen-service ./protos/kitchen.proto
          python -m grpc_tools.protoc -I./protos --python_out=./accounting-service --grpc_python_out=./accounting-service ./protos/accounting.proto
          python -m grpc_tools.protoc -I./protos --python_out=./orchestrator --grpc_python_out=./orchestrator ./protos/order.proto
          python -m grpc_tools.protoc -I./protos --python_out=./orchestrator --grpc_python_out=./orchestrator ./protos/kitchen.proto
          python -m grpc_tools.protoc -I./protos --python_out=./orchestrator --grpc_python_out=./orchestrator ./protos/accounting.proto
          python -m grpc_tools.protoc -I./protos --python_out=./api-gateway --grpc_python_out=./api-gateway ./protos/order.proto
          python -m grpc_tools.protoc -I./protos --python_out=./api-gateway --grpc_python_out=./api-gateway ./protos/kitchen.proto
          python -m grpc_tools.protoc -I./protos --python_out=./api-gateway --grpc_python_out=./api-gateway ./protos/accounting.proto

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push - Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: nesrinebousrih/gourmet-go-order-service:latest

      - name: Build & Push - Kitchen Service
        uses: docker/build-push-action@v5
        with:
          context: ./kitchen-service
          push: true
          tags: nesrinebousrih/gourmet-go-kitchen-service:latest

      - name: Build & Push - Accounting Service
        uses: docker/build-push-action@v5
        with:
          context: ./accounting-service
          push: true
          tags: nesrinebousrih/gourmet-go-accounting-service:latest

      - name: Build & Push - Orchestrator
        uses: docker/build-push-action@v5
        with:
          context: ./orchestrator
          push: true
          tags: nesrinebousrih/gourmet-go-orchestrator:latest

      - name: Build & Push - API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: nesrinebousrih/gourmet-go-api-gateway:latest

      - name: Build & Push - Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: nesrinebousrih/gourmet-go-frontend:latest
